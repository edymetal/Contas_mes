name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Ensure GitHub Pages is configured
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GH_REPOSITORY}/pages"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          api_header="X-GitHub-Api-Version: 2022-11-28"
          accept_header="Accept: application/vnd.github+json"

          status=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -H "${auth_header}" \
            -H "${api_header}" \
            -H "${accept_header}" \
            "${api_url}")

          if [ "${status}" = "404" ]; then
            status=$(curl -sS -o /tmp/pages-create-response.json -w "%{http_code}" \
              -X POST \
              -H "${auth_header}" \
              -H "${api_header}" \
              -H "${accept_header}" \
              "${api_url}" \
              -d '{"build_type":"workflow"}')

            if [ "${status}" != "201" ] && [ "${status}" != "409" ]; then
              cat /tmp/pages-create-response.json
              exit 1
            fi
          elif [ "${status}" = "200" ]; then
            status=$(curl -sS -o /tmp/pages-update-response.json -w "%{http_code}" \
              -X PATCH \
              -H "${auth_header}" \
              -H "${api_header}" \
              -H "${accept_header}" \
              "${api_url}" \
              -d '{"build_type":"workflow"}')

            if [ "${status}" != "200" ]; then
              cat /tmp/pages-update-response.json
              exit 1
            fi
          else
            cat /tmp/pages-response.json
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
