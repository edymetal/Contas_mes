name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-test-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: 1:000000000000:web:ci-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test application and project policies
        run: npm test

      - name: Validate Firebase configuration
        run: npm run check:firebase-env

      - name: Build
        run: npm run build
